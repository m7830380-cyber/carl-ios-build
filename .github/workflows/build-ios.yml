name: Build iOS IPA

# PUBLIC repo: holds only this workflow and generic CI scripts. The project lives in the PRIVATE repo
# m7830380-cyber/carl-ios, checked out with the PRIVATE_REPO_TOKEN secret. Nothing from the project is
# printed, cached or uploaded here: Unity/Xcode logs go to the private repo's `ci-logs` release, the IPA
# to its `ios-latest` release. The only cache is the stock Unity editor install.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/commit of the private repo to build'
        default: main

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.6.1f1
  UNITY_CHANGESET: 7efac9f6c10e
  PRIVATE_REPO: m7830380-cyber/carl-ios

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check out private project
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src

      - name: Xcode
        run: xcodebuild -version

      - name: Restore Unity install
        id: unity-cache
        uses: actions/cache/restore@v4
        with:
          path: /Applications/Unity
          key: unity-${{ env.UNITY_VERSION }}-ios-arm64-v1

      - name: Install Unity ${{ env.UNITY_VERSION }} + iOS module (arm64)
        if: steps.unity-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE=https://download.unity3d.com/download_unity/$UNITY_CHANGESET
          curl -fsSL --retry 3 -o /tmp/editor.pkg "$BASE/MacEditorInstallerArm64/Unity-$UNITY_VERSION.pkg" &
          curl -fsSL --retry 3 -o /tmp/ios.pkg "$BASE/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-$UNITY_VERSION.pkg" &
          wait
          ls -lh /tmp/*.pkg
          sudo installer -pkg /tmp/editor.pkg -target /
          sudo installer -pkg /tmp/ios.pkg -target /
          rm -f /tmp/editor.pkg /tmp/ios.pkg
          sudo chown -R "$(whoami)" /Applications/Unity

      - name: Save Unity install
        if: steps.unity-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/Unity
          key: unity-${{ env.UNITY_VERSION }}-ios-arm64-v1

      # Unity 6.x pkgs install into /Applications/Unity/Unity-<version>/ (older ones into /Applications/Unity/).
      - name: Locate Unity
        run: |
          set -euo pipefail
          APP=$(find /Applications/Unity -maxdepth 3 -name Unity.app -type d | head -n 1)
          [ -n "$APP" ] || { echo "Unity.app not found"; find /Applications/Unity -maxdepth 3; exit 1; }
          ROOT=$(dirname "$APP"); echo "UNITY_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Unity root: $ROOT"; file "$APP/Contents/MacOS/Unity"
          find /Applications/Unity -maxdepth 6 -type d -name iOSSupport | grep . || { echo "iOS module not found"; exit 1; }

      # The .ulf is bound to the machine it was made on, so activate this runner with the serial inside it
      # and return the seat afterwards.
      - name: Activate Unity
        timeout-minutes: 12
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          [ -n "$UNITY_LICENSE" ] || { echo "secret UNITY_LICENSE is missing"; exit 1; }
          SERIAL=$(printf '%s' "$UNITY_LICENSE" | python3 -c "import sys,re,base64; d=re.search(r'<DeveloperData Value=\"([^\"]+)\"',sys.stdin.read()).group(1); print(base64.b64decode(d)[4:].decode())")
          [ -n "$SERIAL" ] || { echo "could not read the serial from UNITY_LICENSE"; exit 1; }
          echo "::add-mask::$SERIAL"
          mkdir -p /tmp/activate-project logs
          for d in "/Library/Application Support/Unity" "/Library/Application Support/Unity/licenses" "$HOME/Library/Unity/licenses"; do
            sudo mkdir -p "$d"; sudo chown -R "$(whoami)" "$d"; sudo chmod -R 775 "$d"
          done
          mkdir -p "$HOME/Library/Unity/cache"
          OK="License activated successfully|license is already valid and activated|Successfully activated"
          for attempt in 1 2; do
            ci/unity.sh logs/activate.log 240 "$OK" -quit -serial "$SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /tmp/activate-project
            rc=$?
            echo "attempt $attempt: exit code $rc"
            [ $rc = 0 ] && break
            grep -iE "licens|entitlement|serial" logs/activate.log | tail -n 25
          done
          exit $rc

      - name: Unity build (Xcode project)
        timeout-minutes: 90
        env:
          IOS_OUT: ${{ github.workspace }}/xcode
        run: |
          set +e
          ci/unity.sh "$PWD/logs/unity.log" 5000 "" -quit -projectPath "$PWD/src/project" -buildTarget iOS -executeMethod IosBuild.Build
          rc=$?
          grep -E "^\[IosBuild\] result" logs/unity.log || true
          [ -f xcode/Unity-iPhone.xcodeproj/project.pbxproj ] || { echo "no Xcode project produced (full log: private repo, release ci-logs)"; exit 1; }
          exit $rc

      - name: Return Unity license
        if: always()
        timeout-minutes: 4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          [ -n "${UNITY_ROOT:-}" ] && [ -x "$UNITY_ROOT/Unity.app/Contents/MacOS/Unity" ] || exit 0
          mkdir -p logs
          ci/unity.sh logs/return.log 150 "" -quit -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true

      - name: Xcode build (unsigned)
        run: |
          cd xcode
          set +e
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO build > ../logs/xcodebuild.log 2>&1
          rc=$?
          grep -E "^\*\* BUILD" ../logs/xcodebuild.log || true
          echo "xcodebuild exit $rc, $(grep -c 'error:' ../logs/xcodebuild.log) error lines (full log: private repo, release ci-logs)"
          exit $rc

      - name: Fakesign (ldid) and package IPA
        run: |
          set -euo pipefail
          brew install ldid >/dev/null
          APP="$(find xcode/dd -name '*.app' -path '*Release-iphoneos*' | head -n 1)"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          APP="Payload/$(basename "$APP")"
          for fw in "$APP"/Frameworks/*.framework; do
            [ -d "$fw" ] && ldid -S "$fw/$(basename "$fw" .framework)"
          done
          ldid -Sci/entitlements.plist "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          zip -qry CARL-iOS.ipa Payload
          ls -lh CARL-iOS.ipa

      - name: Publish IPA (private repo)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG=ios-latest
          NOTES="IPA from public run ${{ github.run_number }}, private commit $(git -C src rev-parse --short HEAD)"
          if gh release view "$TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" CARL-iOS.ipa --clobber --repo "$PRIVATE_REPO"
            gh release edit "$TAG" --notes "$NOTES" --repo "$PRIVATE_REPO"
          else
            gh release create "$TAG" CARL-iOS.ipa --repo "$PRIVATE_REPO" --title "C.A.R.L. iOS (latest build)" --notes "$NOTES" --prerelease
          fi

      - name: Upload logs (private repo)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p logs
          cp -R ~/Library/Logs/Unity logs/unity-system 2>/dev/null || true
          zip -qr ci-logs.zip logs
          gh release view ci-logs --repo "$PRIVATE_REPO" >/dev/null 2>&1 || \
            gh release create ci-logs --repo "$PRIVATE_REPO" --title "CI logs (latest run)" --notes "logs" --prerelease
          gh release upload ci-logs ci-logs.zip --clobber --repo "$PRIVATE_REPO"
          gh release edit ci-logs --notes "logs of public run ${{ github.run_number }}" --repo "$PRIVATE_REPO"
          echo "logs uploaded to the private repo"
